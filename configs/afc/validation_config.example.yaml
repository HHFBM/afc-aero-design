# AFC validation and regression configuration example.
afc_config_version: 1
config_type: validation

model:
  weights_directory: null
  training_statistics_path: null

benchmark:
  airfoil: naca0012
  alpha_deg: 5.0
  velocity_mps: 25.0
  mach: 0.05
  reynolds: 1000000.0
  spanwise_resolution: 2
  model_size: xsmall
  c_mu_sweep: [0.0, 0.01, 0.02]
  x_jet: 0.1
  theta_jet: 30.0

checks:
  run_2d_zero_afc_consistency: true
  run_2d_surrogate_error: true
  run_3d_no_afc_baseline: true
  run_3d_afc_monotonicity: true
  run_opti_convergence: true
  include_avl: false

external_data:
  external_2d_dataset: null
  external_2d_manifest: null
  external_2d_truth_label: "real_or_placeholder_but_user_supplied"
  synthetic_2d_cases: 12
  large_cfd_data_policy: "Keep large CFD/RANS/experimental datasets outside the repository and pass paths at runtime."

thresholds:
  zero_afc_abs_tolerance: 1.0e-12
  three_d_no_afc_abs_tolerance: 1.0e-10
  cl_mae_target_first_release: 0.03
  cd_relative_error_target_first_release: 0.15
  cm_rmse_target_first_release: 0.02

report:
  output_directory: validation_outputs/afc
  formats: ["json", "markdown"]
  max_2d_cases: 25
  required_metadata: ["code_version", "model_weights_path", "dataset_source", "dataset_manifest", "config_path", "run_time"]
